name: Bug report
description: Report a Flight Notch issue.
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include steps to reproduce and the expected behavior.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and Xcode versions
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: App-only screenshots are welcome. Remove exact user location, credentials, and desktop content. For routes, include only the public callsign and approximate time.
