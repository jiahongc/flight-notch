name: Flight Notch checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flight-notch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version
      - name: Test
        run: swift test
      - name: Build and verify location entitlement
        run: ./build.sh
      - name: Verify code signature
        run: codesign --verify --deep --strict "$HOME/Library/Caches/FlightNotch/DerivedData/Build/Products/Release/Flight Notch.app"
